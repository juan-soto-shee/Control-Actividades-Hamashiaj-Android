name: Compilar APK Android
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar icono EMHA a tamaño completo
        run: |
          curl --fail --location --retry 3 --output /tmp/emha-icon.png https://control-actividades-hamashiaj.web.app/icons/icon-512.png
          python3 -m pip install --user Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Image.open('/tmp/emha-icon.png').convert('RGBA')
          # Recorte de márgenes exteriores: el logo ocupa más superficie del icono.
          w, h = source.size
          margin = round(min(w, h) * 0.04)
          source = source.crop((margin, margin, w - margin, h - margin))
          for folder, size in [('mipmap-mdpi',48),('mipmap-hdpi',72),('mipmap-xhdpi',96),('mipmap-xxhdpi',144),('mipmap-xxxhdpi',192)]:
              target = Path('app/src/main/res') / folder
              target.mkdir(parents=True, exist_ok=True)
              source.resize((size,size),Image.Resampling.LANCZOS).save(target/'ic_launcher.png')
          PY
      - name: Compilar APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Control-Actividades-Hamashiaj-APK
          path: app/build/outputs/apk/debug/app-debug.apk
